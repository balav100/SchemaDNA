[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schemadna"
version = "0.1.0"
description = "Automated schema fingerprinting and schema drift detection for Python"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Balasubramaniam V" }
]
keywords = [
    "schema",
    "schema-drift",
    "data-drift",
    "data-quality",
    "data-engineering",
    "pandas",
    "data-validation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "pandas>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.0",
    "twine>=5.0"
]

[project.urls]
Homepage = "https://github.com/balav100/SchemaDNA"
Repository = "https://github.com/balav100/SchemaDNA"
Issues = "https://github.com/balav100/SchemaDNA/issues"

[tool.setuptools.packages.find]
include = ["schemadna*"]

[tool.pytest.ini_options]
testpaths = ["tests"]